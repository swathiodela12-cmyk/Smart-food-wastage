{% extends "base.html" %}
{% block title %}Food Waste Management - Hostel Food System{% endblock %}
{% block extra_head %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/food-waste.css') }}">
{% endblock %}
{% block content %}
<div class="fw-root">
  <nav class="fw-nav">
    <div class="fw-brand">Food Waste Management</div>
    <div class="fw-tabs" id="fw-tabs">
      <button class="fw-tab active" data-tab="menu">Your menu</button>
      <button class="fw-tab" data-tab="overview">Overview</button>
      <button class="fw-tab" data-tab="settings">Settings</button>
      <button class="fw-tab" data-tab="menus">Menus</button>
      <button class="fw-tab" data-tab="holidays">Holidays</button>
      <button class="fw-tab" data-tab="insights">Insights</button>
      <button class="fw-tab" data-tab="alerts">Alert log</button>
    </div>
    <div class="fw-nav-right">
      <a href="{{ url_for('dashboard') }}" class="fw-link">&larr; Main app</a>
      <button id="fw-notif-btn" class="fw-notif-btn">
        &#9888; Notifications <span id="fw-notif-badge" class="fw-badge" style="display:none;">0</span>
      </button>
      <a href="{{ url_for('logout') }}" class="fw-link fw-logout">Logout</a>
    </div>
  </nav>

  <main id="fw-content" class="fw-content"></main>
  <div id="fw-toast" class="fw-toast" style="display:none;"></div>
</div>
{% endblock %}
{% block extra_scripts %}
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.4/chart.umd.min.js"></script>
<script src="{{ url_for('static', filename='js/food-waste.js') }}"></script>
{% endblock %}
